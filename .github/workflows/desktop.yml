name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: fraum-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  package-macos-arm64:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:macos:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: fraum-macos-arm64
          path: dist/*
          if-no-files-found: error
