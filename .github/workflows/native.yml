name: Native builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  browser-client-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: fraum-native.exe
            asset: fraum-windows-x64.exe
          - os: ubuntu-22.04
            binary: fraum-native
            asset: fraum-linux-x64
          - os: macos-15
            binary: fraum-native
            asset: fraum-macos-arm64
          - os: macos-15-intel
            binary: fraum-native
            asset: fraum-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml --release
      - name: Name the executable
        shell: bash
        run: |
          mkdir out
          cp "native/target/release/${{ matrix.binary }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - browser-client-tests
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fraum-*
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${assets[@]}"
