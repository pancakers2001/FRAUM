[package]
name = "fraum-native"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
open = "5"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rfd = "0.15"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
